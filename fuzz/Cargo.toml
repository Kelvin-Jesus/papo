[package]
name = "papo-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
papo = { path = ".." }

# Kept out of the main crate's build: fuzzing needs nightly and libFuzzer.
[workspace]
members = ["."]

[[bin]]
name = "invite_decode"
path = "fuzz_targets/invite_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "frame_decode"
path = "fuzz_targets/frame_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "room_open"
path = "fuzz_targets/room_open.rs"
test = false
doc = false
bench = false
