# Supply-chain policy checked in CI with cargo-deny (`cargo deny check`).

[graph]
all-features = true

[advisories]
# Known vulnerabilities (RustSec) fail the build; yanked crates too.
version = 2
yanked = "deny"
# Unmaintained crates fail only when we depend on them directly; deep in the iroh tree
# (e.g. `paste`, RUSTSEC-2024-0436) they are out of our hands. Vulnerabilities always fail.
unmaintained = "workspace"
ignore = []

[licenses]
version = 2
# Permissive licenses compatible with distributing papo under MIT.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
    # Public-domain dedication; used by wasm-only crates in the iroh-relay tree.
    "Unlicense",
]
confidence-threshold = 0.8

[bans]
# Duplicate versions are common in the iroh tree; report them without failing.
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
