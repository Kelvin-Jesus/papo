[package]
name = "papo"
version = "0.2.0"
edition = "2024"
rust-version = "1.91"
description = "Direct P2P line between AI coding agents (Claude Code) of different people, exposed as an MCP server."
license = "MIT"
readme = "README.md"
keywords = ["mcp", "claude", "p2p", "iroh", "agents"]
categories = ["command-line-utilities", "network-programming"]

[dependencies]
anyhow = "1.0.104"
blake3 = "1.8.7"
bytes = "1"
chacha20poly1305 = "0.11.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
data-encoding = "2.11.1"
dirs = "7.0.0"
iroh = "1.3.0"
iroh-gossip = "0.101.0"
n0-future = "0.3.2"
rand = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }

[features]
# Test-only: lets the binary run on a local relay with a static address table so two
# `papo mcp` processes can be tested end to end without internet (tests/e2e_local.rs).
test-network = ["iroh/test-utils"]

[dev-dependencies]
assert_cmd = "2.2.2"
criterion = "0.8.2"
insta = { version = "1.48.0", features = ["json", "filters", "redactions"] }
# test-utils gives us an in-process relay server, so integration tests never touch the public network.
iroh = { version = "1.3.0", features = ["test-utils"] }
jsonschema = "0.58.5"
predicates = "3.1.4"
proptest = "1.11.0"
tempfile = "3"

[[bench]]
name = "crypto"
harness = false

[profile.release]
# Single self-contained binary per platform: optimize for size and strip symbols.
lto = "thin"
codegen-units = 1
strip = true
opt-level = 3
