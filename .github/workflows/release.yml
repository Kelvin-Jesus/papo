name: release

# Push a tag like v0.1.0 to publish binaries for Linux, macOS and Windows.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux binaries are static (musl) so they run on any distro; zig provides
          # the cross C toolchain that ring needs.
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest, zig: true }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-latest, zig: true }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: aarch64-apple-darwin, os: macos-latest }
          # Windows on ARM runs the x64 build through emulation.
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - if: matrix.zig
        uses: mlugg/setup-zig@v2
      - if: matrix.zig
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      - name: Build (zig)
        if: matrix.zig
        run: cargo zigbuild --release --locked --target ${{ matrix.target }}
      - name: Build
        if: ${{ !matrix.zig }}
        run: cargo build --release --locked --target ${{ matrix.target }}

      # scripts/install.sh downloads these exact names; rename there too.
      - name: Package (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          version="${GITHUB_REF_NAME}"
          name="papo-${version}-${{ matrix.target }}"
          mkdir -p "dist/${name}"
          cp "target/${{ matrix.target }}/release/papo" README.md LICENSE "dist/${name}/"
          tar -C dist -czf "dist/${name}.tar.gz" "${name}"
          rm -rf "dist/${name}"
          cd dist && shasum -a 256 "${name}.tar.gz" > "${name}.tar.gz.sha256"

      # .deb and .rpm from the same static binary (packaging/nfpm.yaml).
      - name: Package (deb, rpm)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          curl -fsSL -o nfpm.tgz https://github.com/goreleaser/nfpm/releases/download/v2.41.0/nfpm_2.41.0_Linux_x86_64.tar.gz
          echo "2fec509cc508fd7688b03f1426747725e93e024ff3c94a7f02022a50ddaa6c04  nfpm.tgz" | sha256sum -c -
          tar -xzf nfpm.tgz nfpm
          case "${{ matrix.target }}" in
            x86_64-*) export PAPO_ARCH=amd64 ;;
            aarch64-*) export PAPO_ARCH=arm64 ;;
          esac
          export PAPO_VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p target/nfpm
          cp "target/${{ matrix.target }}/release/papo" target/nfpm/papo
          for packager in deb rpm; do ./nfpm pkg -f packaging/nfpm.yaml -p "$packager" -t dist/; done
          cd dist && for f in *.deb *.rpm; do shasum -a 256 "$f" > "$f.sha256"; done

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "papo-$env:GITHUB_REF_NAME-${{ matrix.target }}"
          New-Item -ItemType Directory -Force "dist/$name" | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/papo.exe", README.md, LICENSE "dist/$name/"
          Compress-Archive -Path "dist/$name" -DestinationPath "dist/$name.zip"
          Remove-Item -Recurse "dist/$name"
          $hash = (Get-FileHash "dist/$name.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name.zip" | Out-File -Encoding ascii "dist/$name.zip.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: papo-${{ matrix.target }}
          path: dist/*

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Release gate: every tag ships with hand-written notes in docs/releases/<tag>.md, and the
      # notes must not still be marked as a draft.
      - name: Check release notes
        run: |
          notes="docs/releases/${GITHUB_REF_NAME}.md"
          test -f "$notes" || { echo "::error::missing $notes"; exit 1; }
          if grep -qi "rascunho" "$notes"; then echo "::error::$notes is still marked as a draft"; exit 1; fi
          if grep -q "\[Preencher" "$notes"; then echo "::error::$notes has unfilled placeholders"; exit 1; fi
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: docs/releases/${{ github.ref_name }}.md
          generate_release_notes: true

  # Package managers. Each step runs only when its secret exists, so a release never fails
  # before the accounts are set up (knowledge/playbooks/cut-a-release.md lists the secrets).
  pacotes:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    env:
      DEPLOY_KEY: ${{ secrets.PACOTES_DEPLOY_KEY }}
      AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Generate manifests
        run: python3 scripts/pacotes.py "$GITHUB_REF_NAME" dist pacotes

      # The Homebrew tap and the Scoop bucket are this repo (Formula/ and bucket/). main requires
      # the quality gate, so the commit goes through a deploy key that the ruleset lets bypass it.
      - name: Homebrew formula and Scoop manifest on main
        if: env.DEPLOY_KEY != ''
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes"
          git clone --quiet --depth 1 --branch main git@github.com:Kelvin-Jesus/papo.git main-repo
          cp pacotes/homebrew/Formula/papo.rb main-repo/Formula/papo.rb
          cp pacotes/scoop/papo.json main-repo/bucket/papo.json
          cd main-repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/papo.rb bucket/papo.json
          git diff --cached --quiet || git commit --quiet -m "chore(pacotes): Homebrew e Scoop na $GITHUB_REF_NAME"
          git push --quiet origin main

      - name: AUR (papo-bin)
        if: env.AUR_SSH_KEY != ''
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$AUR_SSH_KEY" > ~/.ssh/aur && chmod 600 ~/.ssh/aur
          ssh-keyscan -t ed25519 aur.archlinux.org >> ~/.ssh/known_hosts
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/aur -o IdentitiesOnly=yes"
          git clone --quiet ssh://aur@aur.archlinux.org/papo-bin.git aur
          cp pacotes/aur/PKGBUILD pacotes/aur/.SRCINFO aur/
          cd aur
          git config user.name "papo release"
          git config user.email "papo-release@users.noreply.github.com"
          git add PKGBUILD .SRCINFO
          git diff --cached --quiet || git commit --quiet -m "papo $GITHUB_REF_NAME"
          git push --quiet origin HEAD:master

      - name: crates.io
        if: env.CARGO_REGISTRY_TOKEN != ''
        run: cargo publish --locked
