name: pages

# Publishes the landing page (site/) and the mdBook docs (docs/) to GitHub Pages:
#   https://kelvin-jesus.github.io/papo/       <- site/
#   https://kelvin-jesus.github.io/papo/docs/  <- mdbook build docs
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "site/**"
      - "assets/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; never cancel a deploy that is already running.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  MDBOOK_VERSION: v0.5.4

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mdBook ${{ env.MDBOOK_VERSION }}
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSfL "https://github.com/rust-lang/mdBook/releases/download/${MDBOOK_VERSION}/mdbook-${MDBOOK_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            | tar -xz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build docs
        run: mdbook build docs

      - name: Assemble site
        run: |
          mkdir -p _site/assets
          cp -R site/. _site/
          cp -R assets/logo _site/assets/logo
          rm -rf _site/assets/logo/source
          cp -R docs/book _site/docs
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
