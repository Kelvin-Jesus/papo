name: ci

# Every quality gate of the repository lives in this one workflow so that a single
# aggregate job, `quality gate`, can depend on all of them. Require that check on main.
# Informative jobs (not in the gate) say so in their name and use continue-on-error.
on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same PR supersedes the older run; runs on main always finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Snapshot mismatches fail in CI instead of writing new snapshots.
  INSTA_UPDATE: "no"
  MDBOOK_VERSION: v0.5.4
  GITLEAKS_VERSION: 8.30.1
  ACTIONLINT_VERSION: 1.7.12

jobs:
  # ---------------------------------------------------------------- Rust
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo clippy --all-targets --locked --features test-network -- -D warnings
      # Unit, doc, property, robustness, store, node scenario, MCP contract and CLI
      # tests, plus the hermetic two-process e2e (local relay). No internet needed.
      # --no-fail-fast: one failing test binary must not hide failures in the others.
      - run: cargo test --locked --features test-network --no-fail-fast
      - if: matrix.os == 'ubuntu-latest'
        name: Benchmarks and fuzz targets still compile
        run: |
          cargo bench --locked --no-run
          cargo check --manifest-path fuzz/Cargo.toml --bins

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      # Measured at 94% of lines when the floor was set; the slack absorbs
      # timing-dependent branches (reconnects, lag) that vary between runs.
      - name: Measure (fails under 90% of lines)
        run: cargo llvm-cov --locked --features test-network --lcov --output-path lcov.info --fail-under-lines 90
      - name: Coverage summary
        if: always()
        run: |
          {
            echo '## Cobertura de testes'
            echo
            echo '```'
            cargo llvm-cov report --summary-only
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lcov
          path: lcov.info

  # The oldest Rust that builds everything, read from Cargo.toml so there is one source
  # of truth. Dependencies (iroh 1.3) set the floor: 1.91.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: msrv
        name: Read rust-version from Cargo.toml
        run: echo "version=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv
      - run: cargo check --locked --all-targets --features test-network

  rustdoc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Broken intra-doc links and other rustdoc warnings fail the build.
      - run: cargo doc --no-deps --locked --features test-network
        env:
          RUSTDOCFLAGS: -D warnings

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Advisories (RustSec), licenses, banned crates and sources; policy in deny.toml.
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check all

  # ---------------------------------------------------------------- docs and site
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install mdBook ${{ env.MDBOOK_VERSION }}
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSfL --retry 3 "https://github.com/rust-lang/mdBook/releases/download/${MDBOOK_VERSION}/mdbook-${MDBOOK_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            | tar -xz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      # Same assembly as pages.yml; fails on any mdBook warning.
      - name: Build the book and assemble _site
        run: scripts/build-site.sh
      - name: Local links and anchors (site + book)
        run: python3 scripts/check-book-links.py _site
      - name: Every Mermaid diagram renders
        run: python3 scripts/check-mermaid.py README.md docs/arquitetura.md docs/engenharia/diagramas.md
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: _site
          include-hidden-files: true

  site:
    needs: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: _site
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Weight budget (gzip HTML <= 30 KB, CSS <= 15 KB, JS <= 20 KB)
        run: python3 scripts/check-site-budget.py site
      - name: Valid HTML (html-validate, rules in .htmlvalidate.json)
        run: npx --yes html-validate@11.16.1 site/index.html
      # Desktop preset, median of 3 runs: performance >= 0.9, accessibility >= 0.95,
      # best practices >= 0.95, SEO >= 0.9 and no color-contrast failure (.lighthouserc.json).
      - name: Lighthouse CI
        run: npx --yes @lhci/cli@0.15.1 autorun
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse
          path: .lighthouseci
          include-hidden-files: true

  # ---------------------------------------------------------------- repository rules
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: No person names (maintainer's rule)
        run: scripts/check-names.sh
      - name: "Conventional commits: tipo(escopo): descrição"
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            range="$PR_BASE..$PR_HEAD"
          elif [ -z "$BEFORE" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            # New branch (before = 000...) or a force push that dropped the old tip.
            range="$AFTER~1..$AFTER"
          else
            range="$BEFORE..$AFTER"
          fi
          python3 scripts/check-commits.py "$range"

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks over the whole history
        run: |
          curl -sSfL --retry 3 "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          ./gitleaks git --redact --no-banner .

  lint-workflows:
    name: lint (workflows and scripts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # actionlint runs shellcheck (preinstalled on the runner) over every `run:` block.
      - name: actionlint
        run: |
          curl -sSfL --retry 3 "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            | tar -xz actionlint
          ./actionlint -no-color
      - name: shellcheck
        run: shellcheck scripts/*.sh .githooks/*

  # ---------------------------------------------------------------- informative
  # Two real MCP servers talking through the public iroh network (n0 DNS + relays).
  # Not part of the gate: depends on third-party infrastructure being reachable.
  e2e-public-network:
    name: e2e-public-network (informative)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked --test mcp -- --ignored

  # ---------------------------------------------------------------- the gate
  # The one check to require on main. It fails unless every gating job succeeded
  # (a skipped or cancelled dependency also fails it, so nothing slips through).
  quality-gate:
    name: quality gate
    if: always()
    needs: [test, coverage, msrv, rustdoc, supply-chain, docs, site, rules, secrets, lint-workflows]
    runs-on: ubuntu-latest
    steps:
      - name: Every gating job passed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | python3 -c '
          import json, sys
          needs = json.load(sys.stdin)
          bad = {job: r["result"] for job, r in needs.items() if r["result"] != "success"}
          for job in sorted(needs):
              print(("ok   " if job not in bad else "FAIL ") + job + ": " + needs[job]["result"])
          sys.exit(1 if bad else 0)
          '
