name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Snapshot mismatches fail in CI instead of writing new snapshots.
  INSTA_UPDATE: "no"

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo clippy --all-targets --locked --features test-network -- -D warnings
      # Unit, doc, property, robustness, store, node scenario, MCP contract and CLI
      # tests, plus the hermetic two-process e2e (local relay). No internet needed.
      - run: cargo test --locked --features test-network
      - if: matrix.os == 'ubuntu-latest'
        name: Benchmarks and fuzz targets still compile
        run: |
          cargo bench --locked --no-run
          cargo check --manifest-path fuzz/Cargo.toml --bins

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      # Measured at 94% of lines when the floor was set; the slack absorbs
      # timing-dependent branches (reconnects, lag) that vary between runs.
      - name: Measure (fails under 90% of lines)
        run: cargo llvm-cov --locked --features test-network --lcov --output-path lcov.info --fail-under-lines 90
      - name: Coverage summary
        if: always()
        run: |
          {
            echo '## Cobertura de testes'
            echo
            echo '```'
            cargo llvm-cov report --summary-only
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lcov
          path: lcov.info

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Advisories (RustSec), licenses, banned crates and sources; policy in deny.toml.
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check all

  # Two real MCP servers talking through the public iroh network (n0 DNS + relays).
  # Informative only: depends on third-party infrastructure being reachable.
  e2e-public-network:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked --test mcp -- --ignored
